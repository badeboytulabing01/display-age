name: Test Workflow CI

on: 
push: 
  branches: [main] 

jobs: 
  build: 
     runs-on: ubuntu-latest
     strategy:
       matrix:
         node-version: [16.x, 18.x] 
      steps:
        - uses: actions/checkout@v3
        - name: Use NodeJS ${{matrix.node-version}} and clone repo
          uses: actions/setup-node@v3
          with:
            node-version: ${{matrix.node-version}}
      - run npm install
      - run npm ci
      - run run build
      - run npm test